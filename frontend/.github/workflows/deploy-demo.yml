name: Deploy demo to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to deploy
        required: true
        default: master
        type: string
      channel:
        description: Deployment intent
        required: true
        default: preview
        type: choice
        options:
          - release
          - preview

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone demo
        env:
          DEPLOY_CHANNEL: ${{ inputs.channel }}
          DEPLOY_REF: ${{ inputs.ref }}
        run: npm run build:demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4