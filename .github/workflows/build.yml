name: Build

on: [push]

jobs:

  build_fe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
    - run: npm run lint
    - run: npm test -- run
    - run: npm run build
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: frontend/build

  test_be:
    runs-on: ubuntu-latest
    needs: build_fe
    steps:
    - uses: actions/checkout@v4

    # The backend embeds the frontend, so it is needed to build it at all.
    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: build
        path: frontend/build

    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Check formatting
      working-directory: rust
      run: cargo fmt --check

    - name: Clippy
      working-directory: rust
      run: cargo clippy --all-targets -- -D warnings

    - name: Unit tests
      working-directory: rust
      run: cargo test

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install API test dependencies
      run: python -m pip install pytest aiohttp PyYAML

    - name: API tests
      run: python -m pytest rust/api_tests

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    needs: test_be
    strategy:
      matrix:
        include:
          # Every Linux binary is static, linked against musl by zig, so it
          # runs on any distribution whatever its glibc. There are no C
          # dependencies, so one runner builds them all.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: camillagui_linux_amd64.tar.gz
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: camillagui_linux_aarch64.tar.gz
            zig: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            asset: camillagui_linux_armv7.tar.gz
            zig: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: camillagui_windows_amd64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: camillagui_macos_aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: camillagui_macos_intel.tar.gz
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4

    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: build
        path: frontend/build

    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install zig and cargo-zigbuild
      if: matrix.zig
      run: python3 -m pip install cargo-zigbuild

    - name: Build with zig
      if: matrix.zig
      working-directory: rust
      run: cargo zigbuild --release --target ${{ matrix.target }}

    - name: Build
      if: ${{ !matrix.zig }}
      working-directory: rust
      run: cargo build --release --target ${{ matrix.target }}

    # A release is the binary, with the default settings in config/ next to
    # it, and a copy of the stylesheet there to edit, which the backend serves
    # in place of the one built in.
    - name: Package
      run: |
        mkdir -p package/config
        cp config/camillagui.yml config/gui-config.yml frontend/build/css-variables.css package/config/
        cp rust/target/${{ matrix.target }}/release/camillagui* package/
        rm -f package/camillagui.d package/camillagui.pdb
        if [[ "${{ matrix.asset }}" == *.zip ]]; then
          (cd package && 7z a ../${{ matrix.asset }} .)
        elif [[ "${{ runner.os }}" == "macOS" ]]; then
          tar -zcvf ${{ matrix.asset }} -C package .
        else
          tar -zcvf ${{ matrix.asset }} -C package . --owner=0 --group=0 --numeric-owner
        fi

    - name: Upload as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset }}
        path: ${{ matrix.asset }}

    - name: Upload to release
      if: contains(github.ref, 'refs/tags/')
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ matrix.asset }}
        asset_name: ${{ matrix.asset }}
        tag: ${{ github.ref }}
