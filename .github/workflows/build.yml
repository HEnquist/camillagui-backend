name: Build

on: [push]

jobs:

  build_fe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
    # The backend's test checks api/openapi.json against the code, this checks the types
    # generated from it.
    - name: Check that the API types are current
      run: |
        npm run generate-api
        git diff --exit-code src/api/schema.ts || (echo "Run npm run generate-api in frontend/" && exit 1)
    - run: npm run lint
    - run: npm test -- run
    - run: npm run build
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: frontend/build

  test_be:
    runs-on: ubuntu-latest
    needs: build_fe
    steps:
    - uses: actions/checkout@v4

    # The backend embeds the frontend, so it is needed to build it at all.
    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: build
        path: frontend/build

    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Check formatting
      working-directory: api
      run: cargo fmt --check

    - name: Clippy
      working-directory: api
      run: cargo clippy --all-targets -- -D warnings

    - name: Unit tests
      working-directory: api
      run: cargo test

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install API and GUI test dependencies
      run: |
        python -m pip install pytest aiohttp PyYAML playwright
        python -m playwright install --with-deps --only-shell chromium

    - name: API and GUI tests
      run: python -m pytest api/api_tests

  # The unit tests again on Windows, for the code that differs there: paths
  # with drives and the hook commands run by cmd. Formatting is checked on
  # Linux, and the API and GUI tests run there only.
  test_windows:
    runs-on: windows-latest
    needs: build_fe
    steps:
    - uses: actions/checkout@v4

    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: build
        path: frontend/build

    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Clippy
      working-directory: api
      run: cargo clippy --all-targets -- -D warnings

    - name: Unit tests
      working-directory: api
      run: cargo test

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    needs: [test_be, test_windows]
    strategy:
      matrix:
        include:
          # Every Linux binary is static, linked against musl by zig, so it
          # runs on any distribution whatever its glibc. There are no C
          # dependencies, so one runner builds them all.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: camillagui_linux_amd64.tar.gz
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: camillagui_linux_aarch64.tar.gz
            zig: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            asset: camillagui_linux_armv7.tar.gz
            zig: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: camillagui_windows_amd64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: camillagui_macos_aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: camillagui_macos_intel.tar.gz
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4

    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: build
        path: frontend/build

    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install zig and cargo-zigbuild
      if: matrix.zig
      run: python3 -m pip install cargo-zigbuild

    - name: Build with zig
      if: matrix.zig
      working-directory: api
      run: cargo zigbuild --release --target ${{ matrix.target }}

    - name: Build
      if: ${{ !matrix.zig }}
      working-directory: api
      run: cargo build --release --target ${{ matrix.target }}

    # A release is the binary, with the default settings in config/ next to
    # it. The stylesheet is built in; a css-variables.css the user puts in
    # config/ is served in its place.
    - name: Package
      run: |
        mkdir -p package/config
        cp config/camillagui.yml config/gui-config.yml package/config/
        cp api/target/${{ matrix.target }}/release/camillagui* package/
        rm -f package/camillagui.d package/camillagui.pdb
        if [[ "${{ matrix.asset }}" == *.zip ]]; then
          (cd package && 7z a ../${{ matrix.asset }} .)
        elif [[ "${{ runner.os }}" == "macOS" ]]; then
          tar -zcvf ${{ matrix.asset }} -C package .
        else
          tar -zcvf ${{ matrix.asset }} -C package . --owner=0 --group=0 --numeric-owner
        fi

    - name: Upload as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset }}
        path: ${{ matrix.asset }}

    - name: Upload to release
      if: contains(github.ref, 'refs/tags/')
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ matrix.asset }}
        asset_name: ${{ matrix.asset }}
        tag: ${{ github.ref }}
